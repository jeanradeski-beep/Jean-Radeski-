<title>Sorteador de Comentários</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: duas colunas (regras + participantes | palco do sorteio), empilhadas no celular */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --fg: #1a1b2e;
  --muted: #5d6078;
  --line: #dfe1ea;
  --accent: #d6246e;
  --accent-ink: #ffffff;
  --ok: #157a4a;
  --bad: #b3261e;
  --stage: #1a1b2e;
  --stage-fg: #f6f3ff;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12131f; --surface: #1b1c2c; --fg: #ecebf5; --muted: #a2a4bd; --line: #2e3046;
    --accent: #ff4f93; --accent-ink: #1a0b12; --ok: #4fd18e; --bad: #ff7b72;
    --stage: #0b0c15; --stage-fg: #f6f3ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12131f; --surface: #1b1c2c; --fg: #ecebf5; --muted: #a2a4bd; --line: #2e3046;
  --accent: #ff4f93; --accent-ink: #1a0b12; --ok: #4fd18e; --bad: #ff7b72;
  --stage: #0b0c15; --stage-fg: #f6f3ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.7rem, 4vw, 2.4rem); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 4px 0 0; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; margin: 0; }
label { font-weight: 600; font-size: .9rem; display: grid; gap: 6px; }
.hint { font-weight: 400; color: var(--muted); font-size: .82rem; }
input[type="text"], input[type="number"], textarea, select {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%;
}
textarea { font-family: var(--font-mono); font-size: .82rem; resize: vertical; min-height: 180px; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .row { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; }
.check input { margin-top: 4px; accent-color: var(--accent); }
.tag { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: .82rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.pill.ok { color: var(--ok); border-color: currentColor; }
.pill.bad { color: var(--bad); border-color: currentColor; }
details summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
.list { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
.list table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.list td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.list td:first-child { font-family: var(--font-mono); white-space: nowrap; }
.list td:last-child { color: var(--muted); }

.stage { background: var(--stage); color: var(--stage-fg); border-radius: 18px; padding: 22px; display: grid; gap: 16px; min-width: 0; }
.stage h2 { color: var(--stage-fg); }
.brand { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
.reel {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 6vw, 2.8rem); text-align: center;
  padding: 28px 10px; border-radius: 12px; border: 1px dashed rgba(246,243,255,.25); min-height: 120px;
  display: grid; place-items: center; overflow-wrap: anywhere;
}
.reel.win { color: #ff8fbb; border-style: solid; border-color: #ff4f93; }
.btn { font: 600 1rem var(--font-body); border: 0; border-radius: 10px; padding: 13px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: inherit; border: 1px solid currentColor; font-size: .9rem; padding: 9px 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.result { display: grid; gap: 6px; }
.result ol { margin: 0; padding-left: 22px; font-family: var(--font-mono); }
.result li { padding: 2px 0; overflow-wrap: anywhere; }
.result .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; opacity: .7; }
.stamp { font-family: var(--font-mono); font-size: .75rem; opacity: .7; }
.toast { font-size: .85rem; color: var(--ok); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Sorteador de <span>comentários</span></h1>
      <p class="sub">Cole os comentários do post, defina as regras e sorteie.</p>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="t-regras">
      <h2 id="t-regras">Regras do sorteio</h2>
      <label>Nome do sorteio / marca
        <input type="text" id="brand" value="Sorteio Perfil Metais">
      </label>
      <div class="row">
        <label>Amigos marcados (mínimo)
          <input type="number" id="minMentions" min="0" max="20" value="2">
        </label>
        <label>Chances
          <select id="mode">
            <option value="person">1 chance por pessoa</option>
            <option value="comment">1 chance por comentário válido</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Vencedores
          <input type="number" id="winners" min="1" max="50" value="1">
        </label>
        <label>Suplentes
          <input type="number" id="backups" min="0" max="50" value="2">
        </label>
      </div>
      <label>Palavra-chave obrigatória <span class="hint">Deixe vazio se não houver.</span>
        <input type="text" id="keyword" placeholder="ex.: #quero">
      </label>
      <label class="check"><input type="checkbox" id="noSelf" checked> Não vale marcar a si mesmo nem a própria marca</label>
      <label class="check"><input type="checkbox" id="uniqueFriends" checked> Contar só amigos diferentes (marcar o mesmo @ 2x não conta)</label>
      <label>Perfis excluídos <span class="hint">Funcionários, ganhadores anteriores, a própria loja. Um por linha ou separados por vírgula.</span>
        <textarea id="blocked" style="min-height:70px">@perfilmetais</textarea>
      </label>
    </section>

    <section class="panel" aria-labelledby="t-part">
      <h2 id="t-part">Comentários</h2>
      <label>Cole aqui, um comentário por linha
        <span class="hint">Formato: <code>usuario comentário com @amigos</code>. Exemplo abaixo; apague e cole os seus.</span>
        <textarea id="input" style="min-height:240px"></textarea>
      </label>
      <div class="stats" id="stats"></div>
      <details>
        <summary>Ver participantes e motivos de exclusão</summary>
        <div class="list"><table><tbody id="detail"></tbody></table></div>
      </details>
    </section>
  </div>

  <section class="stage" aria-labelledby="t-stage">
    <div class="brand" id="brandOut">Sorteio Perfil Metais</div>
    <h2 id="t-stage">Sorteio</h2>
    <div class="reel" id="reel" aria-live="polite">Pronto para sortear</div>
    <div class="actions">
      <button class="btn" id="go">Sortear</button>
      <button class="btn ghost" id="copy" hidden>Copiar resultado</button>
    </div>
    <div class="result" id="result" hidden></div>
    <div class="toast" id="toast" aria-live="polite"></div>
  </section>
</div>

<script>
const SAMPLE = `ana.souza Quero muito! @joao.p @carla_m
joao.p Participando @ana.souza @pedrinho
maria.l Eu quero @bia
carla_m Boa sorte pra mim @maria.l @lucas.r
carla_m De novo! @bia @joao.p
pedrinho @pedrinho @pedrinho
lucas.r Quero ganhar @ana.souza @maria.l
perfilmetais Obrigado a todos! @ana.souza @joao.p
bia Tô dentro @lucas.r @carla_m`;

const $ = id => document.getElementById(id);
const FIELDS = ["brand", "minMentions", "mode", "winners", "backups", "keyword", "noSelf", "uniqueFriends", "blocked", "input"];
let lastResult = "";

const clean = h => h.trim().replace(/^@/, "").replace(/[:,.;!?]+$/, "").toLowerCase();

function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("sorteador") || "null"); } catch (e) {}
  FIELDS.forEach(f => {
    const el = $(f);
    if (saved && f in saved) el.type === "checkbox" ? (el.checked = saved[f]) : (el.value = saved[f]);
  });
  if (!$("input").value.trim()) $("input").value = SAMPLE;
}
function save() {
  const data = {};
  FIELDS.forEach(f => { const el = $(f); data[f] = el.type === "checkbox" ? el.checked : el.value; });
  try { localStorage.setItem("sorteador", JSON.stringify(data)); } catch (e) {}
}

function rules() {
  return {
    min: Math.max(0, parseInt($("minMentions").value) || 0),
    mode: $("mode").value,
    winners: Math.max(1, parseInt($("winners").value) || 1),
    backups: Math.max(0, parseInt($("backups").value) || 0),
    keyword: $("keyword").value.trim().toLowerCase(),
    noSelf: $("noSelf").checked,
    unique: $("uniqueFriends").checked,
    blocked: new Set($("blocked").value.split(/[\s,;]+/).map(clean).filter(Boolean)),
  };
}

// Lê cada linha: primeiro termo = autor, resto = comentário
function evaluate() {
  const r = rules();
  const rows = [];
  $("input").value.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if (!line) return;
    const [first, ...rest] = line.split(/\s+/);
    const author = clean(first);
    const text = rest.join(" ");
    let mentions = (text.match(/@[\w.]+/g) || []).map(clean);
    if (r.noSelf) mentions = mentions.filter(m => m !== author && !r.blocked.has(m));
    const count = r.unique ? new Set(mentions).size : mentions.length;
    let reason = "";
    if (!author) reason = "sem autor";
    else if (r.blocked.has(author)) reason = "perfil excluído";
    else if (count < r.min) reason = `marcou ${count} de ${r.min} amigos`;
    else if (r.keyword && !text.toLowerCase().includes(r.keyword)) reason = "sem a palavra-chave";
    rows.push({ author, text, valid: !reason, reason });
  });

  const validRows = rows.filter(x => x.valid);
  const people = [...new Set(validRows.map(x => x.author))];
  const entries = r.mode === "person" ? people.slice() : validRows.map(x => x.author);
  return { r, rows, validRows, people, entries };
}

function render() {
  const { rows, validRows, people, entries } = evaluate();
  const invalid = rows.length - validRows.length;
  $("stats").innerHTML =
    `<span class="pill">${rows.length} comentários</span>` +
    `<span class="pill ok">${people.length} participantes válidos</span>` +
    `<span class="pill">${entries.length} chances</span>` +
    (invalid ? `<span class="pill bad">${invalid} inválidos</span>` : "");
  $("detail").innerHTML = rows.map(x =>
    `<tr><td>@${esc(x.author)}</td><td style="color:${x.valid ? "var(--ok)" : "var(--bad)"}">${x.valid ? "válido" : esc(x.reason)}</td></tr>`
  ).join("") || `<tr><td colspan="2">Nenhum comentário colado ainda.</td></tr>`;
  $("brandOut").textContent = $("brand").value || "Sorteio";
  save();
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Aleatório criptográfico (mais justo que Math.random)
function rand(n) {
  const a = new Uint32Array(1), lim = Math.floor(0xffffffff / n) * n;
  do crypto.getRandomValues(a); while (a[0] >= lim);
  return a[0] % n;
}

function draw() {
  const { r, entries, people } = evaluate();
  const need = r.winners + r.backups;
  if (!people.length) { $("reel").textContent = "Nenhum participante válido"; return; }
  let pool = entries.slice();
  const picked = [];
  while (picked.length < need && pool.length) {
    const who = pool[rand(pool.length)];
    picked.push(who);
    pool = pool.filter(p => p !== who); // a pessoa sai do sorteio depois de sorteada
  }
  const go = $("go"), reel = $("reel");
  go.disabled = true; $("copy").hidden = true; $("result").hidden = true; reel.classList.remove("win");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0; const total = reduce ? 0 : 2600;
  const spin = () => {
    reel.textContent = "@" + people[rand(people.length)];
    t += 70 + t / 18;
    if (t < total) setTimeout(spin, 70 + t / 18); else finish();
  };
  const finish = () => {
    const win = picked.slice(0, r.winners), sup = picked.slice(r.winners);
    reel.textContent = "@" + win[0]; reel.classList.add("win");
    const now = new Date().toLocaleString("pt-BR");
    const brand = $("brand").value || "Sorteio";
    $("result").innerHTML =
      `<div class="label">Vencedor${win.length > 1 ? "es" : ""}</div><ol>${win.map(w => `<li>@${esc(w)}</li>`).join("")}</ol>` +
      (sup.length ? `<div class="label">Suplentes</div><ol>${sup.map(w => `<li>@${esc(w)}</li>`).join("")}</ol>` : "") +
      `<div class="stamp">${people.length} participantes válidos · ${entries.length} chances · ${now}</div>`;
    $("result").hidden = false; $("copy").hidden = false; go.disabled = false; go.textContent = "Sortear de novo";
    lastResult = `${brand}\nVencedor(es): ${win.map(w => "@" + w).join(", ")}` +
      (sup.length ? `\nSuplentes: ${sup.map(w => "@" + w).join(", ")}` : "") +
      `\n${people.length} participantes válidos · ${entries.length} chances · ${now}`;
  };
  spin();
}

$("go").addEventListener("click", draw);
$("copy").addEventListener("click", () => {
  const ok = () => { $("toast").textContent = "Resultado copiado"; setTimeout(() => $("toast").textContent = "", 2500); };
  try {
    navigator.clipboard.writeText(lastResult).then(ok, () => { $("toast").textContent = lastResult; });
  } catch (e) { $("toast").textContent = lastResult; }
});
FIELDS.forEach(f => $(f).addEventListener("input", render));
load(); render();
</script>
