<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.s{position:relative;width:1080px;height:1920px;background:url(../9x16/aj-noite-916.jpg) center/cover}
.s:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,4,.92) 0%,rgba(8,6,4,.55) 30%,rgba(8,6,4,.15) 48%,rgba(8,6,4,.35) 62%,rgba(8,6,4,.95) 88%)}
.top{position:absolute;top:250px;left:80px;right:80px;text-align:center}
.tag{display:inline-block;padding:14px 30px;border:2px solid #e2b26b;border-radius:60px;color:#f0c987;font-weight:700;font-size:30px;letter-spacing:.14em}
h1{font-family:'Playfair Display',serif;font-size:96px;line-height:1.02;margin-top:34px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
h1 em{color:#f0c987;font-style:italic}
.big{font-family:Inter;font-weight:800;font-size:200px;line-height:1;color:#f0c987;letter-spacing:-.03em;margin-top:10px}
.lbl{font-size:44px;font-weight:700;letter-spacing:.06em}
.bot{position:absolute;bottom:260px;left:80px;right:80px;text-align:center}
.prize{font-family:'Playfair Display',serif;font-size:62px;line-height:1.15}
.prize b{color:#f0c987}
.bar{margin:44px auto 0;height:26px;border-radius:20px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#c98a4b,#f0c987)}
.cta{margin-top:40px;font-size:40px;font-weight:700}
.cta span{display:block;font-size:32px;font-weight:500;opacity:.85;margin-top:10px}
</style></head><body><div class="s">
<div class="top">
 <span class="tag">🍾 META DO SORTEIO</span>
 <h1>Bora desbloquear<br><em>um mimo extra?</em></h1>
 <div class="big">20 MIL</div>
 <div class="lbl">COMENTÁRIOS</div>
</div>
<div class="bot">
 <p class="prize">Se a gente bater a meta, o ganhador encontra uma <b>espumante especial</b> no quarto no dia da reserva 🥂</p>
 <div class="bar"><i></i></div>
 <p class="cta">Comenta e marca quem vai com você 👇<span>Cada comentário conta</span></p>
</div>
</div></body></html>
